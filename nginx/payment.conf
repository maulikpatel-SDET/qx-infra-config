# CR-08  TLS certificate and key come from qx-key-service/certs (RSA-2048).
server {
    listen 443 ssl;
    server_name payments.qx.example.com;

    ssl_certificate     /opt/qx/qx-key-service/certs/server.crt;
    ssl_certificate_key /opt/qx/qx-key-service/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
